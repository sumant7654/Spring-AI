spring.application.name=Spring AI

logging.pattern.console=%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n
spring.ai.model.chat=ollama
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=llama3.2:latest
spring.ai.ollama.embedding.model=mxbai-embed-large

logging.level.org.springframework.ai.chat.client.advisor=DEBUG


spring.datasource.url=jdbc:mysql://127.0.0.1:3306/testdb
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update

spring.ai.chat.memory.repository.jdbc.initialize-schema=never

spring.docker.compose.stop.command=down

spring.ai.vectorstore.qdrant.host=localhost
spring.ai.vectorstore.qdrant.initialize-schema=true
spring.ai.vectorstore.qdrant.port=6334
spring.ai.vectorstore.qdrant.collection-name=qdrantrag

audit.token-usag.enabled=true